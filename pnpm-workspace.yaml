packages:
  - "packages/*"
  - "playground"
  - "examples/*"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  bun: true
  core-js: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@eslint/js@10.0.1"
  - "@types/node@24.13.3"
  - "@typescript/typescript6@6.0.2"
  - "eslint@10.8.0"
  - "pnpm@11.18.0"
  - "prettier@3.9.6"
  - "typescript-eslint@8.65.0"
  - "vitest@4.1.10"

patchedDependencies:
  # The beta launcher omits execve's environment, which Node 24.0.0 defaults
  # to empty. Pass it explicitly so TypeScript can start the mapper via node.
  typescript@7.1.0-beta: patches/typescript@7.1.0-beta.patch
