<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sweetener has moved</title>
    <link rel="canonical" href="https://sweetener-ts.github.io/" />
    <script>
      // The site used to live under /sweetener/. Its routes are all in the
      // fragment, so carrying the fragment over keeps old links to an example
      // or a Gist working.
      location.replace("/" + location.hash);
    </script>
  </head>
  <body>
    <p>Sweetener now lives at <a href="/">sweetener-ts.github.io</a>.</p>
  </body>
</html>
