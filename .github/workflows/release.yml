name: Release

# Publication is deliberate: this runs only when someone starts it, or pushes
# an annotated tag at a reviewed commit. Nothing publishes from a branch push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Pack and check without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  # Provenance is signed with a short-lived OIDC token from this workflow. It
  # is why the packages do not declare `publishConfig.provenance`: declaring it
  # made `npm publish` fail anywhere without an OIDC provider, which is every
  # maintainer's machine.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # `pnpm check` builds every example, and the Deno example verifies itself
      # with `deno task`. The runner has no Deno of its own.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Gate
        run: pnpm check

      - name: Stage and verify the tarballs
        run: pnpm release:verify

      - name: Check the tag against the staged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          staged=$(node -p "require('./artifacts/release/release.json').release")
          tagged=${GITHUB_REF_NAME#v}
          if [ "$staged" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match staged version $staged" >&2
            exit 1
          fi

      # Every alpha goes out under the `alpha` dist-tag, which keeps `latest`
      # where it is once a stable version exists. It does not hold for a
      # package's first publish: that version becomes `latest` whatever --tag
      # says, because a package with no `latest` cannot be installed by name.
      # Two ways in, and the workflow takes whichever is configured.
      #
      # A trusted publisher (npmjs.com -> Packages -> package -> Settings ->
      # Trusted publishing) authenticates with the OIDC token this job already
      # requests, needs no secret at all, and attaches provenance on its own.
      # It is configured per package on a package's settings page, so it cannot
      # be set up for a package that does not exist yet: the first publish of a
      # new name goes out with NPM_TOKEN, and every release after it can drop
      # the secret. Requires npm >= 11.5.1, which Node 24.18.1 carries (11.16.0).
      #
      # Keep `registry-url` on setup-node when the secret goes: npm's own
      # example for trusted publishing keeps it, and the CLI detects an OIDC
      # environment and uses it before falling back to a token, so the empty
      # `_authToken` that setup-node writes does not get in the way.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          set -eu
          # Provenance is automatic under a trusted publisher and has to be
          # asked for under a token.
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            attest="--provenance"
          else
            attest=""
          fi
          # The compiler first: every other package depends on it, and a plain
          # glob publishes @sweetener/cli before it exists, leaving a window in
          # which installing the command line fails on a missing dependency.
          ordered=$(ls artifacts/release/tarballs/sweetener-compiler-*.tgz)
          for tarball in artifacts/release/tarballs/*.tgz; do
            case "$tarball" in
              *sweetener-compiler-*) ;;
              *) ordered="$ordered $tarball" ;;
            esac
          done
          for tarball in $ordered; do
            if [ "${DRY_RUN:-false}" = "true" ]; then
              npm publish "$tarball" --tag alpha --access public --dry-run
            else
              npm publish "$tarball" --tag alpha --access public $attest
            fi
          done

      - name: Keep what was published
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            artifacts/release/release.json
            artifacts/release/tarballs
