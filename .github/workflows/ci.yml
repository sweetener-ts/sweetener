name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
      # `pnpm check` builds every example, and the Deno example verifies
      # itself with `deno task`. The runner has no Deno of its own.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  editors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Zed Preview 1.21 compiles an extension library for wasm32-wasip2.
      # 1.98.1 is the toolchain this crate was built with.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - name: Package the editor extensions
        run: node scripts/package-editors.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: editor-extensions
          path: |
            artifacts/editors/*.tar.gz
            artifacts/editors/*.vsix
            artifacts/editors/editors.json
